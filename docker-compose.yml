services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    working_dir: /app/web
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:deploy && npm run seed && npm run dev"
    volumes:
      - .:/app
      - web_node_modules:/app/web/node_modules
      - /app/web/.next
    env_file:
      - web/.env
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@db:5432/erp_db
      NODE_ENV: development
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  web_node_modules:
  pgdata:
